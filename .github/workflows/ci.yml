name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab. GitHub occasionally drops a push event
  # and creates no run at all, and a missing run cannot be re-run.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release version and tag parity
        run: npm run release:check

      - name: Typecheck
        run: npm run typecheck

      - name: Check template shared-base parity
        run: npm run template:parity

      - name: Check example metadata
        run: npm run metadata:check --workspace=example

      - name: Check catalogue parity
        run: npm run catalogue:check

      - name: Check theme manifest parity
        run: npm run themes:check

      - name: Build library
        run: npm run build

      # A real production Metro export catches dependency and asset growth that
      # source-level package budgets cannot see. Offline mode and a cold cache
      # keep this reproducible; the current export takes about 15 seconds.
      - name: Check example production export budget
        run: npm run performance:example

      - name: Accessibility contract gate
        run: npm run test:a11y

      - name: Contract tests
        run: npm test

      - name: Generated files are up to date
        run: |
          # The registry carries each component's source for the CLI to copy, so
          # a source change that skips regeneration ships the old code to
          # everyone installing that way while the npm package moves on.
          npm run docs:generate --workspace=docs
          if ! git diff --quiet; then
            echo 'Generated output does not match the source.'
            echo 'Run: npm run docs:generate --workspace=docs — and commit the result.'
            git diff --stat
            exit 1
          fi

      - name: Build documentation
        run: npm run build --workspace=docs

      - name: Install accessibility smoke browser
        run: npx playwright install --with-deps chromium

      - name: Browser accessibility smoke
        run: npm run test:a11y:browser

      - name: Verify packed CLI consumers
        run: npm run verify:cli-packages

      - name: Template typechecks
        run: |
          # The templates ship to users with their own dependency sets, so they
          # are typechecked against those rather than against the workspace's.
          for template in templates/expo-app templates/expo-starter; do
            npm install --prefix "$template" --ignore-scripts --package-lock=false --no-audit --no-fund

            # ...except for the library itself, which the templates ask for by
            # `latest`. Left alone, this gate would check them against the last
            # publish: a template using something added since would fail until
            # the release, and a publish could turn CI red with no commit
            # behind it. The build from this checkout is what is about to
            # become `latest`, so that is what they are held to.
            rm -rf "$template/node_modules/panelui-native"
            mkdir -p "$template/node_modules/panelui-native"
            cp -R packages/panelui/lib packages/panelui/package.json packages/panelui/theme.css \
              "$template/node_modules/panelui-native/"

            npm run typecheck --prefix "$template"
          done

      # Last, because it is the only step that does not run under the npm the
      # rest of CI uses.
      #
      # publish.yml upgrades to `npm@latest` for trusted publishing, and npm
      # changes the shape of `npm pack --json` between majors — an array in 11,
      # an object keyed by package name in 12. Checking the package under Node's
      # bundled npm 10 therefore proved nothing about the environment the
      # release actually runs in, and let a verifier that crashed under npm 12
      # through to a tag that could not be published.
      - name: Check shipped-surface budgets, under the npm that will publish
        run: |
          npm install -g npm@latest
          npm --version
          # Reuses the release package verifier, then checks the generated
          # registry served by the docs and downloaded by the CLI.
          npm run performance:check

  node20-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test supported CLI runtime
        run: npm run test:cli

      - name: Verify packed CLI consumers
        run: npm run verify:cli-packages
